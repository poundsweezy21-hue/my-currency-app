<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Converter</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #12181f; color: #ffffff; padding: 15px; margin: 0; text-align: center; }
        .card { background: #1b222c; padding: 20px; border-radius: 16px; max-width: 400px; margin: 20px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .box { background: #12181f; border: 1px solid #2a3443; border-radius: 12px; padding: 12px; margin: 10px 0; text-align: left; }
        label { font-size: 12px; color: #8a9ba8; display: block; margin-bottom: 5px; }
        input, select { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        select { color: #4cd964; font-weight: bold; margin-top: 5px; }
        button { background-color: #0088cc; color: white; font-size: 16px; font-weight: bold; width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer; margin-top: 15px; }
        button:active { opacity: 0.8; }
        .result { margin-top: 15px; font-size: 18px; color: #4cd964; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Easy Converter</h2>
        
        <div class="box">
            <label>FROM</label>
            <input type="number" id="amount" value="1" oninput="convert()">
            <select id="fromCurr" onchange="convert()">
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="NGN">NGN - Nigerian Naira</option>
            </select>
        </div>

        <div class="box">
            <label>TO</label>
            <div id="convertedAmount" style="font-size: 24px; font-weight: bold; padding: 5px 0; color: #fff;">--</div>
            <select id="toCurr" onchange="convert()">
                <option value="NGN">NGN - Nigerian Naira</option>
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
            </select>
        </div>

        <button onclick="triggerAdAndConvert()">Convert with Ad</button>
        <div id="status" class="result"></div>
    </div>

    <script>
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "int-56388" }) : null;
        let rates = {};

        async function fetchRates() {
            try {
                let res = await fetch('https://open.er-api.com/v6/latest/USD');
                let data = await res.json();
                rates = data.rates;
                convert();
            } catch (e) {
                document.getElementById('status').innerText = "Could not fetch live rates.";
            }
        }

        function convert() {
            let amount = document.getElementById('amount').value;
            let from = document.getElementById('fromCurr').value;
            let to = document.getElementById('toCurr').value;

            if (!rates[from] || !rates[to]) return;

            let amountInUSD = amount / rates[from];
            let finalResult = amountInUSD * rates[to];

            document.getElementById('convertedAmount').innerText = finalResult.toFixed(2) + " " + to;
        }

        function triggerAdAndConvert() {
            if (AdController) {
                AdController.show().then((result) => {
                    document.getElementById('status').innerText = "Ad watched! Rate updated.";
                    fetchRates();
                }).catch((err) => {
                    document.getElementById('status').innerText = "Conversion complete.";
                    fetchRates();
                });
            } else {
                fetchRates();
            }
        }

        fetchRates();
    </script>
</body>
</html>
